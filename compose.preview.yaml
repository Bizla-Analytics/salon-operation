# Standalone DEV ONLY. Access through SSH, never expose this HTTP port publicly.
# Do not merge with compose.yaml, production, Caddy, or other override files.
services:
  web:
    image: ${SALONOPS_IMAGE:?Use the tested image supplied by the dev workflow}
    restart: unless-stopped
    environment:
      APP_ENV: private-preview
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:?Set a unique random SECRET_KEY}
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: ""
      TIME_ZONE: Asia/Kolkata
      TRUST_PROXY_HEADERS: "False"
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "False"
      SECURE_HSTS_PRELOAD: "False"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: salonops_dev
      POSTGRES_USER: salonops_dev_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a separate app database password}
      AUTO_MIGRATE: "false"
      CHECK_DEPLOY: "false"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: salonops_dev
      POSTGRES_USER: salonops_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set a separate bootstrap password}
      APP_DB_USER: salonops_dev_app
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set the app database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/10-create-app-user.sh:/docker-entrypoint-initdb.d/10-create-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salonops_admin -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  postgres_data:
    # Fixed test-only name. Never rename it after first deployment.
    name: salonops-dev-pgdata
