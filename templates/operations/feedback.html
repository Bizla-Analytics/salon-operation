{% extends 'base.html' %}{% block content %}<div class="mx-auto" style="max-width:720px"><div class="text-center mb-4"><h1 class="h3">How was your experience?</h1><p class="text-muted">Tap one rating for every question.</p></div><form method="post">{% csrf_token %}{% for q in questions %}<div class="card mb-3"><div class="card-body"><div class="fw-semibold mb-3">{{ forloop.counter }}. {{ q.text }}</div><div class="rating-row">{% for n in '12345' %}<input type="radio" id="q{{ q.id }}_{{ n }}" name="q_{{ q.id }}" value="{{ n }}" required><label for="q{{ q.id }}_{{ n }}"><span class="emoji">{% if n == '1' %}😞{% elif n == '2' %}🙁{% elif n == '3' %}😐{% elif n == '4' %}🙂{% else %}😄{% endif %}</span><small>{{ n }}</small></label>{% endfor %}</div></div></div>{% endfor %}<label class="form-label">Suggestion (optional)</label><textarea name="suggestion" class="form-control mb-3" rows="3"></textarea><button class="btn btn-primary btn-xl w-100">Submit feedback</button></form></div>{% endblock %}
