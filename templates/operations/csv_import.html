{% extends 'base.html' %}{% block content %}<h1 class="h3">CSV Import</h1><p class="text-muted">Imports update existing records or insert new records. Use codes for branch and service foreign keys.</p><div class="card"><div class="card-body"><form method="post" enctype="multipart/form-data">{% csrf_token %}<label class="form-label">Table</label><select name="kind" class="form-select mb-3">{% for k in kinds %}<option value="{{ k }}">{{ k }}</option>{% endfor %}</select><label class="form-label">CSV file</label><input class="form-control mb-3" type="file" name="csv_file" accept=".csv" required><button class="btn btn-primary">Import</button></form></div></div>{% if result %}<div class="card mt-3"><div class="card-body"><pre class="mb-0">{% for r in result %}{{ r }}
{% endfor %}</pre></div></div>{% endif %}{% endblock %}
