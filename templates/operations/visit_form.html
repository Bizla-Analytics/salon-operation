{% extends 'base.html' %}
{% block title %}New service visit · SalonOps{% endblock %}
{% block content %}
<header class="page-head split">
  <div><span class="eyebrow">Manager</span><h1>{{ title }}</h1><p>Save the customer first, then add each service with its own staff member and chair.</p></div>
  <a href="{% url 'manager_dashboard' %}" class="button outline">Back</a>
</header>
<div class="panel narrow">
  <form method="post" class="form-grid">
    {% csrf_token %}{{ form.non_field_errors }}{{ form.as_p }}
    <button class="button primary large">Continue to service assignments</button>
  </form>
</div>
{% endblock %}
