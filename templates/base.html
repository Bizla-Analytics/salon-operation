{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}SalonOps{% endblock %}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body>
<nav class="navbar navbar-dark bg-dark sticky-top"><div class="container-fluid"><a class="navbar-brand" href="{% url 'dashboard' %}">SalonOps</a>{% if user.is_authenticated %}<div class="d-flex align-items-center gap-2 text-white"><span class="small d-none d-sm-inline">{{ user.first_name|default:user.username }}</span><a class="btn btn-outline-light btn-sm" href="{% url 'logout' %}">Logout</a></div>{% endif %}</div></nav>
<main class="container py-3 py-md-4">{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script></body></html>
