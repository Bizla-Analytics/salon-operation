<dl class="workflow-timings" aria-label="Measured task time">
  <div><dt>Total task time</dt><dd title="Total task time: {{ obj.total_task_time }}">{{ obj.total_time_short }}</dd></div>
  <div><dt>Working time</dt><dd title="Working time: {{ obj.working_time }}">{{ obj.working_time_short }}</dd></div>
  <div><dt>Waiting time</dt><dd title="Waiting time: {{ obj.waiting_time }}">{{ obj.waiting_time_short }}</dd></div>
</dl>
